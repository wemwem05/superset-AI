x-superset-common: &superset-common
  build: .
  image: martian322/superset:latest
  env_file: .env
  environment:
    SUPERSET_CONFIG_PATH: /app/superset_config.py
  volumes:
    - ./docker/superset_config.py:/app/superset_config.py:ro
    - superset_home:/app/superset_home
  depends_on:
    postgres:
      condition: service_healthy
    redis:
      condition: service_healthy
  restart: unless-stopped

services:
  # ---------------------------------------------------------------------------
  # PostgreSQL — metadata database
  # ---------------------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    env_file: .env
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER}"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 4G
        reservations:
          cpus: '0.25'
          memory: 1G

  # ---------------------------------------------------------------------------
  # Redis — cache + Celery broker
  # ---------------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 2G
        reservations:
          cpus: '0.1'
          memory: 512M

  # ---------------------------------------------------------------------------
  # Superset Init — one-shot: migrations + admin user
  # ---------------------------------------------------------------------------
  superset-init:
    <<: *superset-common
    container_name: superset-init
    command: ["/bin/bash", "/app/superset-init.sh"]
    volumes:
      - ./docker/superset_config.py:/app/superset_config.py:ro
      - ./docker/superset-init.sh:/app/superset-init.sh:ro
      - superset_home:/app/superset_home
    restart: "no"
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 4G
        reservations:
          cpus: '0.25'
          memory: 1G

  # ---------------------------------------------------------------------------
  # Superset Web — main application server
  # ---------------------------------------------------------------------------
  superset:
    <<: *superset-common
    container_name: superset
    command: ["gunicorn", "--bind", "0.0.0.0:8088", "--workers", "5", "--timeout", "120", "--limit-request-line", "0", "superset.app:create_app()"]
    ports:
      - "${SUPERSET_PORT:-8088}:8088"
    depends_on:
      superset-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8088/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 8G
        reservations:
          cpus: '0.5'
          memory: 2G

  # ---------------------------------------------------------------------------
  # Celery Worker — async queries, alerts & reports
  # ---------------------------------------------------------------------------
  superset-worker:
    <<: *superset-common
    container_name: superset-worker
    command: ["celery", "--app=superset.tasks.celery_app:app", "worker", "--pool=prefork", "--concurrency=4", "--max-tasks-per-child=128", "-Ofair", "--loglevel=WARNING"]
    depends_on:
      superset-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "celery --app=superset.tasks.celery_app:app inspect ping | grep -q 'pong'"]
      interval: 30s
      timeout: 30s
      retries: 3
      start_period: 60s
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 8G
        reservations:
          cpus: '0.25'
          memory: 2G

  # ---------------------------------------------------------------------------
  # Celery Beat — periodic task scheduler
  # ---------------------------------------------------------------------------
  superset-beat:
    <<: *superset-common
    container_name: superset-beat
    command: ["celery", "--app=superset.tasks.celery_app:app", "beat", "--pidfile=", "--loglevel=WARNING", "--schedule=/tmp/celerybeat-schedule"]
    depends_on:
      superset-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "[ -f /tmp/celerybeat-schedule ] && find /tmp/celerybeat-schedule -mmin -2 | grep -q celerybeat-schedule || exit 1"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 60s
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 512M
        reservations:
          cpus: '0.1'
          memory: 128M

  # ---------------------------------------------------------------------------
  # PostgreSQL Backup — daily pg_dump to S3 with 7-day retention
  # ---------------------------------------------------------------------------
  postgres-backup:
    image: eeshugerman/postgres-backup-s3:16
    environment:
      SCHEDULE: '0 2 * * *'
      BACKUP_KEEP_DAYS: 7
      S3_REGION: ${S3_REGION}
      S3_BUCKET: ${S3_BUCKET}
      S3_PREFIX: superset-backups
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY}
      # S3_ENDPOINT: ${S3_ENDPOINT}
      POSTGRES_HOST: postgres
      POSTGRES_DATABASE: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
        reservations:
          cpus: '0.1'
          memory: 128M

volumes:
  postgres_data:
  redis_data:
  superset_home:
